<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e12"/>
      <stop offset="50%" stop-color="#0f1217"/>
      <stop offset="100%" stop-color="#141922"/>
    </linearGradient>

    <!-- Accent Gradients from style.css -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d8bfd"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d6efd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e242c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#151920" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="topRightGlow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bottomLeftGlow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#0d6efd" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0d6efd" stop-opacity="0"/>
    </radialGradient>

    <!-- Faint Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#3d8bfd" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#topRightGlow)"/>
  <rect width="1200" height="630" fill="url(#bottomLeftGlow)"/>
  <rect width="1200" height="630" fill="url(#gridPattern)"/>

  <!-- Subtle Outer Border Frame -->
  <rect x="20" y="20" width="1160" height="590" rx="16" fill="none" stroke="#3d8bfd" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- ==================== LEFT SIDE: HERO TITLE & CONTEXT ==================== -->
  <g transform="translate(100, 150)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="150" height="32" rx="16" fill="#1e2530" stroke="#3d8bfd" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#00f2fe"/>
    <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Poppins', sans-serif" font-size="12" font-weight="600" fill="#00f2fe" letter-spacing="1.5">DATA SCIENCE</text>

    <!-- Main Title -->
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Poppins', sans-serif" font-size="68" font-weight="800" fill="#f8f9fa" letter-spacing="-1">
      LLM Evals
    </text>

    <!-- Subtitle with Accent Gradient -->
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Poppins', sans-serif" font-size="24" font-weight="600" fill="url(#primaryGrad)" letter-spacing="0.5">
      Measure. Diagnose. Improve.
    </text>

    <!-- Description / Hook -->
    <text x="0" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Poppins', sans-serif" font-size="16" font-weight="400" fill="#adb5bd">
      A systematic framework for RAG &amp; Q&amp;A applications
    </text>

    <!-- Tagline Chips -->
    <g transform="translate(0, 235)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="125" height="30" rx="6" fill="#181d26" stroke="#3d8bfd" stroke-opacity="0.3"/>
      <text x="14" y="20" font-family="sans-serif" font-size="13" font-weight="500" fill="#f8f9fa">Faithfulness</text>

      <!-- Chip 2 -->
      <rect x="135" y="0" width="135" height="30" rx="6" fill="#181d26" stroke="#3d8bfd" stroke-opacity="0.3"/>
      <text x="149" y="20" font-family="sans-serif" font-size="13" font-weight="500" fill="#f8f9fa">Context Recall</text>

      <!-- Chip 3 -->
      <rect x="280" y="0" width="125" height="30" rx="6" fill="#181d26" stroke="#3d8bfd" stroke-opacity="0.3"/>
      <text x="294" y="20" font-family="sans-serif" font-size="13" font-weight="500" fill="#f8f9fa">Judge Bias</text>
    </g>
  </g>

  <!-- ==================== RIGHT SIDE: EVALUATION DASHBOARD & PIPELINE ==================== -->
  
  <!-- Main Dashboard Card -->
  <g transform="translate(590, 85)">
    <!-- Outer Card Glow / Drop shadow effect -->
    <rect x="-2" y="-2" width="514" height="464" rx="22" fill="none" stroke="url(#primaryGrad)" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="0" y="0" width="510" height="460" rx="20" fill="url(#cardGrad)" stroke="#3d8bfd" stroke-opacity="0.25" stroke-width="1"/>

    <!-- Dashboard Top Bar / Window Controls -->
    <rect x="0" y="0" width="510" height="44" rx="20" fill="#171b22"/>
    <rect x="0" y="24" width="510" height="20" fill="#171b22"/>
    <line x1="0" y1="44" x2="510" y2="44" stroke="#2a3240" stroke-width="1"/>
    
    <circle cx="25" cy="22" r="5" fill="#ff5f56"/>
    <circle cx="42" cy="22" r="5" fill="#ffbd2e"/>
    <circle cx="59" cy="22" r="5" fill="#27c93f"/>

    <text x="255" y="27" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#8b949e" letter-spacing="1">EVALUATION HARNESS &amp; METRICS</text>

    <!-- SECTION 1: 4-STAGE PIPELINE -->
    <g transform="translate(30, 65)">
      <text x="0" y="10" font-family="sans-serif" font-size="11" font-weight="700" fill="#3d8bfd" letter-spacing="1">RAG EXECUTION PIPELINE</text>

      <!-- Connecting Flow Line -->
      <line x1="30" y1="44" x2="420" y2="44" stroke="#2d3748" stroke-width="3"/>
      <line x1="30" y1="44" x2="310" y2="44" stroke="url(#primaryGrad)" stroke-width="3"/>

      <!-- Node 1: Question -->
      <g transform="translate(10, 24)">
        <rect x="0" y="0" width="80" height="40" rx="10" fill="#12161d" stroke="#3d8bfd" stroke-width="1.5"/>
        <text x="40" y="25" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8f9fa">Question</text>
      </g>

      <!-- Node 2: Retrieve -->
      <g transform="translate(120, 24)">
        <rect x="0" y="0" width="80" height="40" rx="10" fill="#12161d" stroke="#3d8bfd" stroke-width="1.5"/>
        <text x="40" y="25" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8f9fa">Retrieve</text>
      </g>

      <!-- Node 3: Generate -->
      <g transform="translate(230, 24)">
        <rect x="0" y="0" width="80" height="40" rx="10" fill="#12161d" stroke="#3d8bfd" stroke-width="1.5"/>
        <text x="40" y="25" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#f8f9fa">Generate</text>
      </g>

      <!-- Node 4: Judge / Metric -->
      <g transform="translate(340, 24)">
        <rect x="0" y="0" width="80" height="40" rx="10" fill="#182333" stroke="#00f2fe" stroke-width="1.5"/>
        <text x="40" y="25" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#00f2fe">Judge</text>
      </g>
    </g>

    <!-- SECTION 2: METRIC BARS & RADIAL RING -->
    <g transform="translate(30, 165)">
      <line x1="0" y1="0" x2="450" y2="0" stroke="#252d3a" stroke-width="1"/>

      <!-- Metric Bars (Left Column) -->
      <g transform="translate(0, 20)">
        <text x="0" y="0" font-family="sans-serif" font-size="11" font-weight="700" fill="#8b949e" letter-spacing="1">BENCHMARK ACCURACY SCORES</text>

        <!-- Metric 1: Faithfulness -->
        <text x="0" y="25" font-family="sans-serif" font-size="12" font-weight="500" fill="#f8f9fa">Faithfulness</text>
        <text x="230" y="25" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="700" fill="#00f2fe">0.94</text>
        <rect x="0" y="33" width="230" height="7" rx="3.5" fill="#202632"/>
        <rect x="0" y="33" width="216" height="7" rx="3.5" fill="url(#primaryGrad)"/>

        <!-- Metric 2: Context Recall -->
        <text x="0" y="65" font-family="sans-serif" font-size="12" font-weight="500" fill="#f8f9fa">Context Recall</text>
        <text x="230" y="65" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="700" fill="#3d8bfd">0.91</text>
        <rect x="0" y="73" width="230" height="7" rx="3.5" fill="#202632"/>
        <rect x="0" y="73" width="209" height="7" rx="3.5" fill="url(#primaryGrad)"/>

        <!-- Metric 3: Answer Relevance -->
        <text x="0" y="105" font-family="sans-serif" font-size="12" font-weight="500" fill="#f8f9fa">Answer Relevance</text>
        <text x="230" y="105" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="700" fill="#38ef7d">0.89</text>
        <rect x="0" y="113" width="230" height="7" rx="3.5" fill="#202632"/>
        <rect x="0" y="113" width="204" height="7" rx="3.5" fill="#38ef7d"/>
      </g>

      <!-- Radial Calibration Gauge (Right Column) -->
      <g transform="translate(365, 80)">
        <!-- Background Track -->
        <circle cx="0" cy="0" r="45" fill="none" stroke="#202735" stroke-width="8"/>
        <!-- 82% Arc Dasharray -->
        <circle cx="0" cy="0" r="45" fill="none" stroke="url(#primaryGrad)" stroke-width="8"
                stroke-dasharray="282.7" stroke-dashoffset="65" stroke-linecap="round"
                transform="rotate(-90)"/>
        
        <text x="0" y="3" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="800" fill="#f8f9fa">0.72</text>
        <text x="0" y="20" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#3d8bfd">KAPPA (κ)</text>
      </g>
    </g>

    <!-- SECTION 3: THE IMPROVEMENT LOOP (CIRCULAR FEEDBACK) -->
    <g transform="translate(30, 340)">
      <rect x="0" y="0" width="450" height="65" rx="12" fill="#141820" stroke="#3d8bfd" stroke-opacity="0.3" stroke-width="1"/>
      
      <!-- Subtle rotating arrow badge -->
      <g transform="translate(25, 32)">
        <circle cx="0" cy="0" r="16" fill="#1d2636"/>
        <path d="M-6,-4 A9,9 0 1,1 6,2" fill="none" stroke="#00f2fe" stroke-width="2.2" stroke-linecap="round"/>
        <polygon points="6,2 3,7 9,5" fill="#00f2fe"/>
      </g>

      <text x="56" y="28" font-family="sans-serif" font-size="11" font-weight="700" fill="#00f2fe" letter-spacing="1">CLOSED-LOOP ATTRIBUTION</text>
      <text x="56" y="48" font-family="sans-serif" font-size="12" font-weight="500" fill="#adb5bd">
        Evaluate → Compare → Diagnose → Recommend → Improve
      </text>
    </g>
  </g>
</svg>
